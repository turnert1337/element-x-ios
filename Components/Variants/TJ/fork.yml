# TJ fork override layer (iOS Workshop, Element card).
# Included from project.yml (the one upstream line edited). Paths here are relative to this file.
# On an upstream sync: take upstream's pbxproj/plists/entitlements, rerun `xcodegen generate`.
# Entitlement override changes: push v1 (aps-environment back on ElementX; NSE filtering still stripped).
settings:
  APP_DISPLAY_NAME: TJ Element          # home-screen label; ASC/TestFlight name is "ElemenTT"
  PRODUCTION_APP_NAME: TJ Element
  BASE_BUNDLE_IDENTIFIER: com.turnertomlinson.element
  APP_GROUP_IDENTIFIER: group.com.turnertomlinson.element
  DEVELOPMENT_TEAM: 3B5YZV963Z
  CLASSIC_APP_GROUP_IDENTIFIER: group.com.turnertomlinson.element
  CLASSIC_APP_KEYCHAIN_ACCESS_GROUP_IDENTIFIER: "$(DEVELOPMENT_TEAM).$(BASE_BUNDLE_IDENTIFIER)"
  # No "classic" app exists for this bundle; keep the classicApp* plist keys free of im.vector.
  CLASSIC_APP_KEYCHAIN_SERVICE_IDENTIFIER: com.turnertomlinson.element.classic-encryption-manager-service

targets:
  ElementX:
    entitlements:
      # Upstream ElementX entitlements MINUS usernotifications.communication (no ASC capability
      # type; the NSE degrades via try?) and associated-domains (not in element.io's AASA).
      # aps-environment is kept as upstream's `development` (push v1); the App Store profile makes
      # it `production` at export. The CLASSIC_* entries resolve to the same group/keychain as
      # below, so they are not repeated.
      properties:REPLACE:
        aps-environment: development
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)
    sources:
    - path: Sources                     # → Components/Variants/TJ/Sources (ForkHooks.swift, ForkDuo*.swift, ForkArtifact*.swift, ForkDevLog.swift, …)
    settings:
      # Duo prep (WatchLab/Element/01_DUO_SPEC.md, research/duo/06_prep_on_26.md §2). -DIS_MAIN_APP stays in
      # OTHER_SWIFT_FLAGS (ElementX/SupportingFiles/target.yml). TJ_SDK27 is set only when building against an
      # iOS 27.x SDK, so 27.1-only code (`#if TJ_SDK27`) is never compiled by Xcode 26.6.
      # TJ_DUO_BACKSCREEN: every config (Release included). The card ships dark: its runtime mode defaults to Off
      #   and nothing registers while Off (spec §4.1 item 3, §6.1, ForkDuoSettings.defaultBackScreenMode).
      # TJ_DUO_PROBE: every config, Release/TestFlight included (steward decision D1, spec rev 3, 2026-10-29). The pill
      #   and log lines are OFF by default in Release and on by default in Debug (ForkDuoSettings.defaultProbeEnabled);
      #   in Release the operator turns it on in Settings > tap the version 7x > Developer options > "Duo probe".
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) TJ_DUO_PROBE TJ_DUO_BACKSCREEN"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphoneos27*]": "$(inherited) TJ_DUO_PROBE TJ_DUO_BACKSCREEN TJ_SDK27"
        "SWIFT_ACTIVE_COMPILATION_CONDITIONS[sdk=iphonesimulator27*]": "$(inherited) TJ_DUO_PROBE TJ_DUO_BACKSCREEN TJ_SDK27"

  UnitTests:
    sources:
    - path: Tests                       # → Components/Variants/TJ/Tests (back-screen policy, D3 fold rules, D4 attach guard, D1 probe default)

  NSE:
    entitlements:
      # Strip com.apple.developer.usernotifications.filtering (restricted; signing would fail).
      properties:REPLACE:
        com.apple.security.application-groups:
        - $(APP_GROUP_IDENTIFIER)
        keychain-access-groups:
        - $(KEYCHAIN_ACCESS_GROUP_IDENTIFIER)

# ShareExtension: NO override. Its upstream entitlements are already group + keychain only,
# driven by the variables above (ShareExtension/SupportingFiles/target.yml:65-71).

# ---------------------------------------------------------------------------------------------
# Upstream source edits so far: 2 of 3 (cap): 1 test fixture + 1 product hook (build 3, see item 2 below).
#
# REMOVED (Duo v2, Xcode 27.1 / Swift 6.4): G5 `@_optimize(none)` on TimelineViewModel.init. It worked around an
# Xcode 26.6 / Swift 6.3.3 Release -O swift-frontend crash ("Invalid SIL provided to OSSACompleteLifetime?!",
# CopyPropagation then Mem2Reg; history in WatchLab/Element/build/g5_fixes.md). A Release device build
# (-configuration Release -destination generic/platform=iOS, -O) on Xcode 27.1 compiles that init cleanly without it
# (WatchLab/Element/build/v2_duo.txt), so the file is byte-identical to upstream again. If the workshop ever builds
# Release on 26.6 again, the crash returns: re-add the attribute or build on 27.1.
# Steward decision D2 (spec rev 3): G5 stays removed in v2; the Ship lane's real Release ARCHIVE is the proof. If that
# archive hits the old crash, the Ship lane restores `@_optimize(none)` on TimelineViewModel.init and re-archives.
#
# Runtime wrap, not a file edit (D4, ForkDuoBackScreen27.swift `ForkDuoSceneConnectTap`): the first back-screen
# registration (mode not Off) wraps upstream `SceneDelegate.scene(_:willConnectTo:options:)` so attach path B can read
# `sceneAccessoryUserInfo`. Upstream's implementation runs first, unchanged; never installed while the mode is Off.
#
# 1. ElementX/Sources/Mocks/JoinedRoomProxyMock.swift (init): `saveDraftThreadRootEventIDReturnValue = .success(())`,
#    beside upstream's loadDraft/clearDraft lines. TEST FIXTURE ONLY, no product code path. The no-login fixture
#    (UI_TESTS_SCREEN=userSessionScreen) left saveDraft unconfigured, so Sourcery's mock crashed on purpose the moment a
#    composer holding text disappeared, which is exactly what a fold (stack <-> split swap) does
#    (ComposerToolbarViewModel `.composerDisappeared` -> saveDraft). Needed for the Duo-prep draft-survives-fold test
#    (WatchLab/Element/build/duo_prep.txt). Upstreamable as-is; drop if upstream configures it.
#
# 2. ElementX/Sources/FlowCoordinators/RoomFlowCoordinator.swift presentRoom (setRootCoordinator + push, 2 changed lines,
#    1 site): the presented RoomScreenCoordinator is wrapped in `ForkRoomChrome.wrap(...)` (Artifacts zone, New chat, Dev log;
#    WatchLab/Element/03_ARTIFACTS_SPEC.md rev 3 D2). Under unit tests `wrap` returns the inner coordinator unchanged, so
#    upstream's `rootCoordinator is RoomScreenCoordinator` assertions hold with zero test edits.
